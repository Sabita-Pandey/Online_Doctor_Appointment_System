<div class="container mt-5">
  <h2 class="text-center mb-4">All Medical Specialties</h2>

  <div class="row g-4">
    <div class="col-md-3" *ngFor="let s of allSpecialties">
      <div class="card text-center p-4 shadow-sm border-0 h-100">
        <i class="fa fa-stethoscope fa-3x text-primary mb-3"></i>
        <h5 class="fw-bold">{{ s.name }}</h5>
        <p class="small text-muted">Expert doctors available</p>
      </div>
    </div>

    <div class="col-12 text-center" *ngIf="allSpecialties.length === 0">
      <p class="text-muted">No specialties found. Please check backend.</p>
    </div>
  </div>

  <div class="text-center mt-5">
    <button routerLink="/" class="btn btn-dark px-4">Back to Home</button>
  </div>
</div>
