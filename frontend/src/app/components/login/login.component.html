<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
    <h2 class="text-center fw-bold mb-4" style="color: #2c3e50;">Doctor Appointment - Login</h2>
    <p class="text-center text-muted">Please login to your account</p>

    <!-- 1. Form submit hone par sirf onSubmit() call hoga -->
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input type="email" name="email" [(ngModel)]="loginData.email" class="form-control p-3 bg-light" placeholder="Email Address" required>
      </div>

      <div class="mb-3">
        <input type="password" name="password" [(ngModel)]="loginData.password" class="form-control p-3 bg-light" placeholder="Password" required>
      </div>

      <div class="text-end mb-3">
        <a href="javascript:void(0)"
           (click)="onForgotPassword()"
           class="text-decoration-none small fw-bold"
           style="color: #007bff;">
          Forget Password?
        </a>
      </div>

      <!-- 2. Button se (click) hata dein, sirf type="submit" kaafi hai -->
      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
        Login
      </button>

      <p class="text-center mt-3 small text-muted">New user?
        <a routerLink="/register" class="text-primary fw-bold text-decoration-none">Register here</a>
      </p>

      <!-- 3. CRITICAL: Is button se routerLink="/home" hata dein!
           Warna koi bhi bina login kiye ispe click karke home page pe chala jayega. -->
      <button type="button" routerLink="/register" class="btn btn-outline-primary w-100 mt-2">
        Add New User/Patient
      </button>
    </form>
  </div>
</div>
